<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚕ Dr. Mohamed Kalboush</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0 }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f3f6fa; color: #1e293b; min-height: 100vh }
header { background: linear-gradient(135deg, #be185d, #7e22ce); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.12) }
header h1 { font-size: 19px; display: flex; align-items: center; gap: 8px }
.status { padding: 5px 14px; border-radius: 20px; font-size: 12.5px; font-weight: bold; color: #fff; cursor: pointer; border: 0 }
.status.online { background: #16a34a }
.status.offline { background: #d97706 }
.status.error { background: #dc2626 }
nav { display: flex; gap: 6px; padding: 10px 16px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.06); flex-wrap: wrap; position: sticky; top: 0; z-index: 50 }
.tab { border: 0; background: #f1f5f9; padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; font-family: inherit; transition: .15s }
.tab:hover { background: #e2e8f0 }
.tab.active { background: #be185d; color: #fff; font-weight: bold; box-shadow: 0 2px 8px rgba(190,24,93,.35) }
.badge { background: #ef4444; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 4px }
.badge:empty { display: none }
main { max-width: 1200px; margin: 16px auto; padding: 0 14px }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px }
.stat { background: #fff; border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.07); transition: .2s }
.stat:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.09) }
